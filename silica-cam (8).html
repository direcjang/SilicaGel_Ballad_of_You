  #shot:active{transform:scale(.94)}
  #flip{width:64px;height:40px;border-radius:20px;background:#333;color:#fff;font-size:14px}
  #mode{width:64px;height:40px;border-radius:20px;background:#333;color:#fff;font-size:14px}
  #shot.rec{border-radius:14px;width:60px;height:60px;animation:pulse 1s infinite}
  #cfg{width:64px;height:40px;border-radius:20px;background:#333;color:#fff;font-size:14px}
  #panel{position:fixed;left:0;right:0;bottom:110px;max-height:52%;overflow-y:auto;background:rgba(17,17,17,.9);color:#fff;font-size:13px;padding:8px 16px 14px;display:none;-webkit-overflow-scrolling:touch}
  #panel.open{display:block}
  #panel h4{margin:14px 0 4px;font-size:13px;color:#ff6b81;font-weight:600}
  #panel .row{display:flex;align-items:center;gap:10px;padding:5px 0}
  #panel .row label{flex:0 0 46%;line-height:1.25}
  #panel .row input[type=range]{flex:1;min-width:0}
  #panel .row output{flex:0 0 42px;text-align:right;font-variant-numeric:tabular-nums;color:#bbb}

  #reset{margin-top:14px;width:100%;height:36px;border-radius:18px;background:#333;color:#fff;font-size:13px}

<body>

  <button id="shot" aria-label="촬영"></button>

<script type="module">
import {ImageSegmenter, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

/* ===== 조절값 ===== */
/* ===== 파라미터 (앱 안 설정 패널에서 조절 / 기본값은 여기) ===== */
const DEFAULTS = {
  cols:48, square:0.8, edge:0.35, reroll:0.12, color:"#e4002b", letters:"boY",
  minArea:25, maxBlobs:2, objEvery:2,
  depth:false, vertPrior:0.3, depthRes:224, depthGamma:1.2, farCut:0.3, depthBlend:0.6,
  lowW:96, contrast:1.2, bright:25, gamma:1.4, glow:0.35, noise:20,
  audio:true,
  frameRot:false, frameBg:"#111111"
};
const DEFS = [
  {sec:"셀"},
  {k:"cols",   label:"셀 개수 (가로)", min:20, max:100, step:1, resize:true},
  {k:"square", label:"빨간 사각형 비중", min:0, max:1, step:0.05},
  {k:"edge",   label:"경계 셀 마크 확률", min:0, max:1, step:0.05},
  {k:"reroll", label:"랜덤 갱신 속도", min:0, max:0.6, step:0.01},
  {k:"color",  label:"셀 색", type:"color"},
  {k:"letters",label:"글자 (예: boY)", type:"text"},
  {sec:"감지"},
  {k:"minArea",  label:"최소 덩어리 크기", min:0, max:200, step:1},
  {k:"maxBlobs", label:"적용할 덩어리 수", min:1, max:6, step:1},
  {k:"objEvery", label:"사물 감지 간격 (프레임)", min:1, max:8, step:1},
  {sec:"배경"},
  {k:"depth",      label:"깊이맵 사용 (실험중 · 불안정)", type:"check"},
  {k:"depthRes",   label:"깊이 해상도 (낮을수록 빠름)", min:112, max:448, step:14},
  {k:"depthBlend", label:"깊이 갱신 반영 속도", min:0.1, max:1, step:0.05},
  {k:"depthGamma", label:"깊이 감마 (클수록 먼 곳 어두움)", min:0.5, max:3, step:0.05},
  {k:"farCut",     label:"어두운 곳 검정 기준", min:0, max:0.7, step:0.01},
  {k:"lowW",     label:"뭉개기 해상도 (작을수록 뭉개짐)", min:24, max:160, step:2, resize:true},
  {k:"contrast", label:"대비", min:0.6, max:3, step:0.05},
  {k:"bright",   label:"밝기", min:-60, max:120, step:1},
  {k:"gamma",    label:"감마 (클수록 어두움)", min:0.6, max:2.5, step:0.05},
  {k:"vertPrior", label:"위쪽 어둡게 (원근 느낌)", min:0, max:0.8, step:0.05},
  {k:"glow",     label:"흰 글로우", min:0, max:1, step:0.05},
  {k:"noise",    label:"노이즈", min:0, max:80, step:1},
  {sec:"프레임"},
  {k:"frameRot", label:"프레임 세로로 돌리기", type:"check", rebuild:true},
  {k:"frameBg",  label:"프레임 바깥 배경색", type:"color"},
  {sec:"녹화"},
  {k:"audio",  label:"소리 포함", type:"check"},
];
const PERSON_CLASS = 15;  // deeplab에서 사람 클래스
const P = {...DEFAULTS};
try{ Object.assign(P, JSON.parse(localStorage.getItem("silicaCamP2")||"{}")); }catch(e){}
try{ if(!localStorage.getItem("silicaMig1")){ P.frameRot = false; localStorage.setItem("silicaMig1","1"); } }catch(e){}
const saveP = () => { try{ localStorage.setItem("silicaCamP2", JSON.stringify(P)); }catch(e){} };
/* ================== */

const $ = id => document.getElementById(id);
const video = $("v"), canvas = $("c"), ctx = canvas.getContext("2d"), msg = $("msg");
const low = document.createElement("canvas"), lctx = low.getContext("2d", {willReadFrequently:true});

let seg, stream, facing = "user";
let W, H, lw, lh, cell, rows, r1, r2, r3;
let seg2;
let mask = null, mw = 0, mh = 0, lastTs = -1;
let omask = null, ow = 0, oh = 0, frameNo = 0;
let gA, bA, bB, tmpA;

async function initModel(){
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const base = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite";
  const make = delegate => ImageSegmenter.createFromOptions(fileset, {
    baseOptions:{modelAssetPath:base, delegate},
    runningMode:"VIDEO", outputConfidenceMasks:true, outputCategoryMask:false
  });
  try{ seg = await make("GPU"); }catch(e){ seg = await make("CPU"); }
  // 사물용 (사람 외 클래스)
  try{
    const obase = "https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplab_v3/float32/latest/deeplab_v3.tflite";
    const make2 = delegate => ImageSegmenter.createFromOptions(fileset, {
      baseOptions:{modelAssetPath:obase, delegate},
      runningMode:"VIDEO", outputConfidenceMasks:false, outputCategoryMask:true
    });
    try{ seg2 = await make2("GPU"); }catch(e){ seg2 = await make2("CPU"); }
  }catch(e){ seg2 = null; }
}

let vw = 0, vh = 0;
function resize(){
  if(!vw) return;
  lw = P.lowW; lh = Math.round(lw*vh/vw);
  gA = new Float32Array(lw*lh); bA = new Float32Array(lw*lh);
  bB = new Float32Array(lw*lh); tmpA = new Float32Array(lw*lh);
  low.width = lw; low.height = lh;
  cell = W/P.cols; rows = Math.ceil(H/cell);
  const n = P.cols*rows;
  r1 = Float32Array.from({length:n}, Math.random);
  r2 = Float32Array.from({length:n}, Math.random);
  r3 = Float32Array.from({length:n}, Math.random);
}

async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:facing}, width:{ideal:1280}, height:{ideal:720}}, audio:false
  });
  video.srcObject = stream;
  await video.play();
  vw = video.videoWidth; vh = video.videoHeight;
  W = 720; H = Math.round(W*vh/vw);
  canvas.width = W; canvas.height = H;
  resize();
  mask = null; omask = null;
}

function blur(src,dst,r){
  const w=lw,h=lh,n=2*r+1;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let t=0;
      for(let k=-r;k<=r;k++){ const xx=x+k<0?0:x+k>=w?w-1:x+k; t+=src[y*w+xx]; }
      tmpA[y*w+x]=t/n;
    }
  }
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let t=0;
      for(let k=-r;k<=r;k++){ const yy=y+k<0?0:y+k>=h?h-1:y+k; t+=tmpA[yy*w+x]; }
      dst[y*w+x]=t/n;
    }
  }
}

function sstep(a,b,x){ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); }


/* ===== 깊이 추정 (Depth Anything V2 small, 브라우저 내 실행) ===== */
let depthReady = false, dA = null, dw = 0, dh = 0, dMin = 0, dMax = 1, dFirst = true;
const dcv = document.createElement("canvas"), dctx = dcv.getContext("2d", {willReadFrequently:true});
const sleep = ms => new Promise(r => setTimeout(r, ms));

let depthStarted = false;
function maybeDepth(){ if(P.depth && !depthStarted){ depthStarted = true; initDepth(); } }

async function initDepth(){
  try{
    if(!rec) msg.textContent = "깊이 모델 불러오는 중…";
    const tf = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6");
    tf.env.allowLocalModels = false;
    const id = "onnx-community/depth-anything-v2-small";
    const tries = [];
    if(navigator.gpu) tries.push({device:"webgpu", dtype:"fp16"});
    tries.push({device:"wasm", dtype:"q8"});
    let model = null;
    for(const o of tries){
      try{ model = await tf.AutoModelForDepthEstimation.from_pretrained(id, o); break; }
      catch(e){ console.warn("depth load fail", o, e); }
    }
    if(!model) throw new Error("model");
    depthLoop(tf, model);
  }catch(e){
    console.warn("depth unavailable", e);
    if(!rec) msg.textContent = "깊이 모델 로드 실패 → 윤곽 방식으로 동작";
    setTimeout(()=>{ if(!rec) msg.textContent = ""; }, 3000);
  }
}

let halfLUT = null;
function getHalfLUT(){
  if(halfLUT) return halfLUT;
  halfLUT = new Float32Array(65536);
  for(let h=0;h<65536;h++){
    const sg = (h&0x8000)?-1:1, e = (h>>10)&0x1f, f = h&0x3ff;
    halfLUT[h] = e===0 ? sg*Math.pow(2,-14)*(f/1024) : e===31 ? (f?NaN:sg*Infinity) : sg*Math.pow(2,e-15)*(1+f/1024);
  }
  return halfLUT;
}

async function depthLoop(tf, model){
  const mean = [0.485,0.456,0.406], std = [0.229,0.224,0.225];
  while(true){
    if(!P.depth || !stream || video.readyState < 2 || !vw){ await sleep(200); continue; }
    try{
      const long = Math.round(P.depthRes/14)*14, ratio = vw/vh;
      let w, h;
      if(ratio < 1){ h = long; w = Math.max(14, Math.round(long*ratio/14)*14); }
      else { w = long; h = Math.max(14, Math.round(long/ratio/14)*14); }
      if(dcv.width !== w || dcv.height !== h){ dcv.width = w; dcv.height = h; }
      dctx.drawImage(video, 0, 0, w, h);
      const px = dctx.getImageData(0,0,w,h).data, n = w*h, f = new Float32Array(3*n);
      for(let i=0;i<n;i++){
        f[i]     = (px[i*4]  /255 - mean[0]) / std[0];
        f[n+i]   = (px[i*4+1]/255 - mean[1]) / std[1];
        f[2*n+i] = (px[i*4+2]/255 - mean[2]) / std[2];
      }
      const out = await model({pixel_values: new tf.Tensor("float32", f, [1,3,h,w])});
      const t = out.predicted_depth, dims = t.dims;
      let data = t.data;
      if(data instanceof Uint16Array){            // fp16 출력 → float32로 디코딩
        const lut = getHalfLUT(), tmp = new Float32Array(data.length);
        for(let i=0;i<data.length;i++) tmp[i] = lut[data[i]];
        data = tmp;
      }
      const oh = dims[dims.length-2], ow = dims[dims.length-1], m = ow*oh;
      let mn = Infinity, mx = -Infinity;
      for(let i=0;i<m;i++){ const v = data[i]; if(!isFinite(v)) continue; if(v<mn) mn=v; if(v>mx) mx=v; }
      if(!dA || dw !== ow || dh !== oh){ dA = new Float32Array(m); dw = ow; dh = oh; dFirst = true; }
      if(dFirst){ dMin = mn; dMax = mx; } else { dMin = dMin*0.7 + mn*0.3; dMax = dMax*0.7 + mx*0.3; }
      const range = Math.max(1e-6, dMax - dMin), b = dFirst ? 1 : P.depthBlend;
      for(let i=0;i<m;i++){
        let v = (data[i]-dMin)/range; v = v<0?0:v>1?1:v;   // 1 = 가까움
        dA[i] = dA[i]*(1-b) + v*b;
      }
      dFirst = false;
      if(!depthReady){ depthReady = true; if(!rec) msg.textContent = ""; }
      if(t.dispose) t.dispose();
    }catch(e){ console.warn("depth run fail", e); await sleep(500); }
    await new Promise(r => requestAnimationFrame(r));
  }
}

function drawDepth(mirror){
  const img = lctx.createImageData(lw, lh), d = img.data;
  for(let y=0;y<lh;y++){
    const dy = (((y+0.5)/lh)*dh)|0;
    for(let x=0;x<lw;x++){
      const sx = mirror ? lw-1-x : x;
      const dn = dA[dy*dw + (((sx+0.5)/lw)*dw|0)];
      let v = 255*Math.pow(dn, P.depthGamma);
      v = (v-128)*P.contrast + 128 + P.bright;
      v = v<0?0:v>255?255:v;
      v *= sstep(P.farCut, P.farCut+0.2, dn);      // 먼 곳 → 검정
      gA[y*lw+x] = v;
    }
  }
  blur(gA, bA, 1);   // 살짝 부드럽게
  blur(bA, bB, 7);   // 글로우용
  for(let i=0,p=0;i<d.length;i+=4,p++){
    const gl = P.glow*255*Math.pow(bB[p]/255, 2);
    const na = Math.min(1, bA[p]/170 + gl/80);
    let v = bA[p] + gl + (Math.random()-0.5)*P.noise*na;
    v = v<0?0:v>255?255:v;
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  lctx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(low, 0, 0, W, H);
}

function drawGray(mirror){
  if(P.depth && depthReady && dA){ drawDepth(mirror); return; }
  lctx.save();
  if(mirror){ lctx.translate(lw,0); lctx.scale(-1,1); }
  lctx.drawImage(video,0,0,lw,lh);
  lctx.restore();
  const img = lctx.getImageData(0,0,lw,lh), d = img.data;
  for(let i=0,p=0;i<d.length;i+=4,p++) gA[p]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
  blur(gA,bA,2);   // 뭉개기
  blur(bA,bB,7);   // 글로우용
  const crush = P.farCut*120;
  for(let i=0,p=0;i<d.length;i+=4,p++){
    const y = (p/lw)|0;
    let v = (bA[p]-128)*P.contrast+128+P.bright;
    v = v<0?0:v>255?255:v;
    v = 255*Math.pow(v/255, P.gamma);
    v *= (1-P.vertPrior) + P.vertPrior*((y+0.5)/lh);   // 위쪽(먼 쪽) 어둡게
    v = Math.max(0, v-crush)*255/(255-crush);          // 어두운 곳 → 검정
    const gl = P.glow*255*Math.pow(bB[p]/255, 2);
    const na = Math.min(1, v/170 + gl/80);
    v = v + gl + (Math.random()-0.5)*P.noise*na;
    v = v<0?0:v>255?255:v;
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  lctx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(low,0,0,W,H);
}

function cover(u,v,mirror){
  // 마스크는 원본(미러 전) 좌표 기준
  if(mirror) u = 1-u;
  let c = 0;
  if(mask){
    const x = Math.min(mw-1, Math.max(0, (u*mw)|0));
    const y = Math.min(mh-1, Math.max(0, (v*mh)|0));
    c = sstep(0.55, 0.9, mask[y*mw+x]);   // 애매한 영역은 컷
  }
  if(omask){
    const x = Math.min(ow-1, Math.max(0, (u*ow)|0));
    const y = Math.min(oh-1, Math.max(0, (v*oh)|0));
    if(omask[y*ow+x]) c = 1;
  }
  return c;
}

let covA, fgA, labA;
function drawCells(mirror){
  if(!mask && !omask) return;
  const n = P.cols*rows;
  if(!covA || covA.length !== n){ covA=new Float32Array(n); fgA=new Uint8Array(n); labA=new Int32Array(n); }
  for(let ry=0; ry<rows; ry++){
    for(let cx=0; cx<P.cols; cx++){
      const u0 = cx/P.cols, v0 = ry*cell/H, du = 1/P.cols, dv = cell/H;
      const c = (
        cover(u0+du*.25, v0+dv*.25, mirror) + cover(u0+du*.75, v0+dv*.25, mirror) +
        cover(u0+du*.25, v0+dv*.75, mirror) + cover(u0+du*.75, v0+dv*.75, mirror)
      )/4;
      covA[ry*P.cols+cx] = c;
      fgA[ry*P.cols+cx] = c >= 0.4 ? 1 : 0;
    }
  }
  // 덩어리 라벨링 → 작은 건 버리고 큰 N개만 남김
  labA.fill(0);
  const areas = [0]; let id = 0;
  const stack = [];
  for(let i=0;i<n;i++){
    if(!fgA[i] || labA[i]) continue;
    id++; let area = 0; stack.push(i); labA[i]=id;
    while(stack.length){
      const q = stack.pop(); area++;
      const x = q%P.cols, y = (q/P.cols)|0;
      if(x>0 && fgA[q-1] && !labA[q-1]){ labA[q-1]=id; stack.push(q-1); }
      if(x<P.cols-1 && fgA[q+1] && !labA[q+1]){ labA[q+1]=id; stack.push(q+1); }
      if(y>0 && fgA[q-P.cols] && !labA[q-P.cols]){ labA[q-P.cols]=id; stack.push(q-P.cols); }
      if(y<rows-1 && fgA[q+P.cols] && !labA[q+P.cols]){ labA[q+P.cols]=id; stack.push(q+P.cols); }
    }
    areas[id] = area;
  }
  const keep = new Set(
    areas.map((a,k)=>[a,k]).filter(([a,k])=>k>0 && a>=P.minArea)
      .sort((p,q)=>q[0]-p[0]).slice(0,P.maxBlobs).map(([,k])=>k)
  );
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `bold ${cell*0.85}px "Courier New", monospace`;
  for(let ry=0; ry<rows; ry++){
    for(let cx=0; cx<P.cols; cx++){
      const i = ry*P.cols+cx;
      if(Math.random()<P.reroll) r1[i]=Math.random();
      if(Math.random()<P.reroll) r2[i]=Math.random();
      if(Math.random()<P.reroll) r3[i]=Math.random();
      if(!keep.has(labA[i])) continue;
      const cov = covA[i];
      const x = cx*cell, y = ry*cell;
      ctx.fillStyle = "#fff";
      ctx.fillRect(x, y, cell+0.5, cell+0.5);
      if(cov < 0.85 && r2[i] > P.edge) continue;
      ctx.fillStyle = P.color;
      if(r1[i] < P.square){
        ctx.fillRect(x+1.5, y+1.5, cell-3, cell-3);
      }else{
        const L=[...P.letters]; if(L.length) ctx.fillText(L[(r3[i]*L.length)|0], x+cell/2, y+cell/2+1);
      }
    }
  }
}

function loop(){
  requestAnimationFrame(loop);
  if(!seg || !stream || video.readyState < 2) return;
  const mirror = facing === "user";
  const ts = performance.now();
  if(ts !== lastTs){
    lastTs = ts;
    seg.segmentForVideo(video, ts, res => {
      const ms = res.confidenceMasks;
      const m = ms[ms.length-1];
      const arr = m.getAsFloat32Array();
      mw = m.width; mh = m.height;
      if(!mask || mask.length !== arr.length) mask = new Float32Array(arr.length);
      mask.set(arr);
    });
  }
  if(seg2 && frameNo++ % P.objEvery === 0){
    seg2.segmentForVideo(video, ts+0.5, res => {
      const m = res.categoryMask;
      const arr = m.getAsUint8Array();
      ow = m.width; oh = m.height;
      if(!omask || omask.length !== arr.length) omask = new Uint8Array(arr.length);
      for(let i=0;i<arr.length;i++) omask[i] = (arr[i]>0 && arr[i]!==PERSON_CLASS) ? 1 : 0;
    });
  }
  drawGray(mirror);
  drawCells(mirror);
  if(frameMode) drawFrame();
}

$("flip").onclick = async () => {
  if(rec) return;
  facing = facing === "user" ? "environment" : "user";
  try{ await startCam(); }catch(e){ msg.textContent = "카메라 전환 실패"; }
};

let mode = "photo", rec = null, chunks = [], micStream = null, recTimer = null;

$("mode").onclick = () => {
  if(rec) return;
  mode = mode === "photo" ? "video" : "photo";
  $("mode").textContent = mode === "photo" ? "사진" : "영상";
};

async function saveBlob(blob, name){
  const file = new File([blob], name, {type: blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==="AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

function takePhoto(){
  outCanvas().toBlob(b => saveBlob(b, `silica-${Date.now()}.png`), "image/png");
}

async function toggleRec(){
  if(rec){ rec.stop(); return; }
  const cs = outCanvas().captureStream(30);
  micStream = null;
  if(P.audio) try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    micStream.getAudioTracks().forEach(t => cs.addTrack(t));
  }catch(e){ micStream = null; }  // 마이크 없으면 무음으로 녹화
  const types = ["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
  const mime = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  chunks = [];
  rec = new MediaRecorder(cs, mime ? {mimeType:mime, videoBitsPerSecond:6000000} : {});
  rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    clearInterval(recTimer); msg.textContent = "";
    $("shot").classList.remove("rec");
    if(micStream) micStream.getTracks().forEach(t => t.stop());
    const type = (rec.mimeType || mime || "video/webm").split(";")[0];
    const blob = new Blob(chunks, {type});
    rec = null;
    saveBlob(blob, `silica-${Date.now()}.${type.includes("mp4") ? "mp4" : "webm"}`);
  };
  rec.start();
  $("shot").classList.add("rec");
  const t0 = Date.now();
  recTimer = setInterval(() => {
    const sec = ((Date.now()-t0)/1000)|0;
    msg.textContent = "● " + String((sec/60)|0).padStart(2,"0") + ":" + String(sec%60).padStart(2,"0");
  }, 250);
}

$("shot").onclick = () => { mode === "photo" ? takePhoto() : toggleRec(); };

/* ===== Ballad of You Frame ===== */
const out = $("out"), octx = out.getContext("2d");
let frameMode = false, FA = null, frameImg = null, maskImg = null;
let frameLayer, maskLayer, tmpC, tctx, hole = {x:0,y:0,w:1,h:1};
const outCanvas = () => frameMode ? out : canvas;

function loadImg(src){
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
async function initFrame(){
  FA = window.FRAME_ASSETS;
  frameImg = await loadImg(FA.frame); maskImg = await loadImg(FA.mask);
  buildFrame();
}
function buildFrame(){
  if(!FA || !frameImg) return;
  const rot = P.frameRot, fw = FA.w, fh = FA.h;
  const cw = rot ? fh : fw, ch = rot ? fw : fh;
  const mk = () => { const c = document.createElement("canvas"); c.width = cw; c.height = ch; return c; };
  const place = (c, img) => {
    const x = c.getContext("2d");
    x.save();
    if(rot){ x.translate(cw, 0); x.rotate(Math.PI/2); }
    x.drawImage(img, 0, 0, fw, fh);
    x.restore();
  };
  frameLayer = mk(); place(frameLayer, frameImg);
  maskLayer = mk();  place(maskLayer, maskImg);
  tmpC = mk(); tctx = tmpC.getContext("2d");
  const [hx,hy,hw,hh] = FA.hole;
  hole = rot ? {x: fh-(hy+hh), y: hx, w: hh, h: hw} : {x: hx, y: hy, w: hw, h: hh};
  out.width = cw; out.height = ch;
}
function drawFrame(){
  if(!frameLayer) return;
  const sw = canvas.width, sh = canvas.height;
  const sc = Math.max(hole.w/sw, hole.h/sh), dw = sw*sc, dh = sh*sc;
  const dx = hole.x + (hole.w-dw)/2, dy = hole.y + (hole.h-dh)/2;
  tctx.globalCompositeOperation = "source-over";
  tctx.clearRect(0, 0, tmpC.width, tmpC.height);
  tctx.drawImage(canvas, dx, dy, dw, dh);
  tctx.globalCompositeOperation = "destination-in";   // 프레임 구멍 모양으로 자르기
  tctx.drawImage(maskLayer, 0, 0);
  octx.fillStyle = P.frameBg;
  octx.fillRect(0, 0, out.width, out.height);
  octx.drawImage(tmpC, 0, 0);
  octx.drawImage(frameLayer, 0, 0);
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  if(rec) return;
  frameMode = b.dataset.m === "frame";
  document.body.classList.toggle("frame", frameMode);
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
});

/* ===== 설정 패널 ===== */
const panel = $("panel");
function buildPanel(){
  panel.innerHTML = "";
  for(const d of DEFS){
    if(d.sec){ const h=document.createElement("h4"); h.textContent=d.sec; panel.appendChild(h); continue; }
    const row=document.createElement("div"); row.className="row";
    const lab=document.createElement("label"); lab.textContent=d.label; row.appendChild(lab);
    let inp, out;
    if(d.type==="color"||d.type==="text"){
      inp=document.createElement("input"); inp.type=d.type; inp.value=P[d.k];
      inp.oninput=()=>{ P[d.k]=inp.value; saveP(); };
    }else if(d.type==="check"){
      inp=document.createElement("input"); inp.type="checkbox"; inp.checked=!!P[d.k];
      inp.onchange=()=>{ P[d.k]=inp.checked; saveP(); if(d.k==="depth") maybeDepth(); if(d.rebuild) buildFrame(); };
    }else{
      inp=document.createElement("input"); inp.type="range";
      inp.min=d.min; inp.max=d.max; inp.step=d.step; inp.value=P[d.k];
      out=document.createElement("output"); out.textContent=P[d.k];
      inp.oninput=()=>{ P[d.k]=+inp.value; out.textContent=inp.value; saveP(); if(d.resize) resize(); };
    }
    row.appendChild(inp); if(out) row.appendChild(out);
    panel.appendChild(row);
  }
  const rs=document.createElement("button"); rs.id="reset"; rs.textContent="기본값으로";
  rs.onclick=()=>{ Object.assign(P, DEFAULTS); saveP(); resize(); buildPanel(); };
  panel.appendChild(rs);
}
buildPanel();
$("cfg").onclick = () => panel.classList.toggle("open");

(async () => {
  try{
    await startCam();
    await initModel();
    msg.textContent = "";
    loop();
    maybeDepth();
    initFrame();
  }catch(e){
    msg.textContent = "카메라/모델 로드 실패: " + (e.message || e.name) + " (HTTPS 또는 localhost에서 열어야 해요)";
  }
})();
