<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Silica Cam</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:system-ui,sans-serif}
  #stage{position:fixed;inset:0 0 110px 0;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:100%;background:#999}
  video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  #msg{position:fixed;top:12px;left:0;right:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 0 4px #000;pointer-events:none}
  #bar{position:fixed;left:0;right:0;bottom:0;height:110px;padding-bottom:env(safe-area-inset-bottom,0);display:flex;align-items:center;justify-content:space-around;background:#111}
  button{border:0;cursor:pointer}
  #shot{width:72px;height:72px;border-radius:50%;background:#e4002b;box-shadow:0 0 0 4px #111,0 0 0 7px #fff}
  #shot:active{transform:scale(.94)}
  #flip{width:64px;height:40px;border-radius:20px;background:#333;color:#fff;font-size:14px}
  .sp{width:64px}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<video id="v" playsinline muted></video>
<div id="msg">모델 불러오는 중…</div>
<div id="bar">
  <button id="flip">전환</button>
  <button id="shot" aria-label="촬영"></button>
  <span class="sp"></span>
</div>

<script type="module">
import {ImageSegmenter, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

/* ===== 조절값 ===== */
const COLS = 48;          // 가로 셀 개수 (작을수록 셀이 큼)
const RED = "#e4002b";
const SQUARE_RATIO = 0.8; // 풀 셀 중 빨간 사각형 비중 (나머지는 b/o/Y 글자)
const LETTERS = ["b","o","Y"];
const EDGE_SHOW = 0.35;   // 경계 셀에 마크가 나올 확률
const REROLL = 0.12;      // 프레임당 셀 랜덤값 갱신 확률 (높을수록 깜빡임 심함)
const CONTRAST = 1.6, BRIGHT = 25, NOISE = 20;
const LOW_W = 56;         // 배경 해상도 (작을수록 더 뭉개짐)
const DETAIL_LO = 2, DETAIL_HI = 12; // 디테일 없는 넓은/먼 면 → 검정 (값 키우면 검정 늘어남)
const MIN_AREA = 25;      // 이보다 작은 감지 덩어리는 무시 (셀 개수)
const MAX_BLOBS = 2;      // 가장 큰 덩어리 N개에만 효과 적용
const GLOW = 0.35;        // 노이즈 뒤 흰색 글로우 세기 (0이면 끔)
const GAMMA = 1.4;        // 클수록 중간톤이 어두워짐 (엑스레이 느낌)
const OBJ_EVERY = 2;      // 사물 감지는 N프레임마다 (성능)
const PERSON_CLASS = 15;  // deeplab에서 사람 클래스
/* ================== */

const $ = id => document.getElementById(id);
const video = $("v"), canvas = $("c"), ctx = canvas.getContext("2d"), msg = $("msg");
const low = document.createElement("canvas"), lctx = low.getContext("2d", {willReadFrequently:true});

let seg, stream, facing = "user";
let W, H, lw, lh, cell, rows, r1, r2, r3;
let seg2;
let mask = null, mw = 0, mh = 0, lastTs = -1;
let omask = null, ow = 0, oh = 0, frameNo = 0;
let gA, bA, bB, tmpA;

async function initModel(){
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const base = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite";
  const make = delegate => ImageSegmenter.createFromOptions(fileset, {
    baseOptions:{modelAssetPath:base, delegate},
    runningMode:"VIDEO", outputConfidenceMasks:true, outputCategoryMask:false
  });
  try{ seg = await make("GPU"); }catch(e){ seg = await make("CPU"); }
  // 사물용 (사람 외 클래스)
  try{
    const obase = "https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplab_v3/float32/latest/deeplab_v3.tflite";
    const make2 = delegate => ImageSegmenter.createFromOptions(fileset, {
      baseOptions:{modelAssetPath:obase, delegate},
      runningMode:"VIDEO", outputConfidenceMasks:false, outputCategoryMask:true
    });
    try{ seg2 = await make2("GPU"); }catch(e){ seg2 = await make2("CPU"); }
  }catch(e){ seg2 = null; }
}

async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:facing}, width:{ideal:1280}, height:{ideal:720}}, audio:false
  });
  video.srcObject = stream;
  await video.play();
  const vw = video.videoWidth, vh = video.videoHeight;
  W = 720; H = Math.round(W*vh/vw);
  canvas.width = W; canvas.height = H;
  lw = LOW_W; lh = Math.round(lw*vh/vw);
  gA = new Float32Array(lw*lh); bA = new Float32Array(lw*lh);
  bB = new Float32Array(lw*lh); tmpA = new Float32Array(lw*lh);
  low.width = lw; low.height = lh;
  cell = W/COLS; rows = Math.ceil(H/cell);
  const n = COLS*rows;
  r1 = Float32Array.from({length:n}, Math.random);
  r2 = Float32Array.from({length:n}, Math.random);
  r3 = Float32Array.from({length:n}, Math.random);
  mask = null; omask = null;
}

function blur(src,dst,r){
  const w=lw,h=lh,n=2*r+1;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let t=0;
      for(let k=-r;k<=r;k++){ const xx=x+k<0?0:x+k>=w?w-1:x+k; t+=src[y*w+xx]; }
      tmpA[y*w+x]=t/n;
    }
  }
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let t=0;
      for(let k=-r;k<=r;k++){ const yy=y+k<0?0:y+k>=h?h-1:y+k; t+=tmpA[yy*w+x]; }
      dst[y*w+x]=t/n;
    }
  }
}

function sstep(a,b,x){ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); }

function drawGray(mirror){
  lctx.save();
  if(mirror){ lctx.translate(lw,0); lctx.scale(-1,1); }
  lctx.drawImage(video,0,0,lw,lh);
  lctx.restore();
  const img = lctx.getImageData(0,0,lw,lh), d = img.data;
  for(let i=0,p=0;i<d.length;i+=4,p++) gA[p]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
  blur(gA,bA,2);   // 뭉개기
  blur(bA,bB,7);   // 넓은 면 기준값
  for(let i=0,p=0;i<d.length;i+=4,p++){
    const detail = Math.abs(bA[p]-bB[p]);
    const k = sstep(DETAIL_LO, DETAIL_HI, detail);   // 디테일 없으면 0 → 검정
    let v = (bA[p]-128)*CONTRAST+128+BRIGHT;
    v = v<0?0:v>255?255:v;
    v = 255*Math.pow(v/255, GAMMA);
    // 노이즈 뒤에 깔리는 은은한 흰 글로우 (밝은 영역 주변으로 번짐)
    const gl = GLOW*255*Math.pow(bB[p]/255, 2);
    const na = Math.min(1, k + gl/80);
    v = v*k + gl + (Math.random()-0.5)*NOISE*na;
    v = v<0?0:v>255?255:v;
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  lctx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(low,0,0,W,H);
}

function cover(u,v,mirror){
  // 마스크는 원본(미러 전) 좌표 기준
  if(mirror) u = 1-u;
  let c = 0;
  if(mask){
    const x = Math.min(mw-1, Math.max(0, (u*mw)|0));
    const y = Math.min(mh-1, Math.max(0, (v*mh)|0));
    c = sstep(0.55, 0.9, mask[y*mw+x]);   // 애매한 영역은 컷
  }
  if(omask){
    const x = Math.min(ow-1, Math.max(0, (u*ow)|0));
    const y = Math.min(oh-1, Math.max(0, (v*oh)|0));
    if(omask[y*ow+x]) c = 1;
  }
  return c;
}

let covA, fgA, labA;
function drawCells(mirror){
  if(!mask && !omask) return;
  const n = COLS*rows;
  if(!covA || covA.length !== n){ covA=new Float32Array(n); fgA=new Uint8Array(n); labA=new Int32Array(n); }
  for(let ry=0; ry<rows; ry++){
    for(let cx=0; cx<COLS; cx++){
      const u0 = cx/COLS, v0 = ry*cell/H, du = 1/COLS, dv = cell/H;
      const c = (
        cover(u0+du*.25, v0+dv*.25, mirror) + cover(u0+du*.75, v0+dv*.25, mirror) +
        cover(u0+du*.25, v0+dv*.75, mirror) + cover(u0+du*.75, v0+dv*.75, mirror)
      )/4;
      covA[ry*COLS+cx] = c;
      fgA[ry*COLS+cx] = c >= 0.4 ? 1 : 0;
    }
  }
  // 덩어리 라벨링 → 작은 건 버리고 큰 N개만 남김
  labA.fill(0);
  const areas = [0]; let id = 0;
  const stack = [];
  for(let i=0;i<n;i++){
    if(!fgA[i] || labA[i]) continue;
    id++; let area = 0; stack.push(i); labA[i]=id;
    while(stack.length){
      const q = stack.pop(); area++;
      const x = q%COLS, y = (q/COLS)|0;
      if(x>0 && fgA[q-1] && !labA[q-1]){ labA[q-1]=id; stack.push(q-1); }
      if(x<COLS-1 && fgA[q+1] && !labA[q+1]){ labA[q+1]=id; stack.push(q+1); }
      if(y>0 && fgA[q-COLS] && !labA[q-COLS]){ labA[q-COLS]=id; stack.push(q-COLS); }
      if(y<rows-1 && fgA[q+COLS] && !labA[q+COLS]){ labA[q+COLS]=id; stack.push(q+COLS); }
    }
    areas[id] = area;
  }
  const keep = new Set(
    areas.map((a,k)=>[a,k]).filter(([a,k])=>k>0 && a>=MIN_AREA)
      .sort((p,q)=>q[0]-p[0]).slice(0,MAX_BLOBS).map(([,k])=>k)
  );
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `bold ${cell*0.85}px "Courier New", monospace`;
  for(let ry=0; ry<rows; ry++){
    for(let cx=0; cx<COLS; cx++){
      const i = ry*COLS+cx;
      if(Math.random()<REROLL) r1[i]=Math.random();
      if(Math.random()<REROLL) r2[i]=Math.random();
      if(Math.random()<REROLL) r3[i]=Math.random();
      if(!keep.has(labA[i])) continue;
      const cov = covA[i];
      const x = cx*cell, y = ry*cell;
      ctx.fillStyle = "#fff";
      ctx.fillRect(x, y, cell+0.5, cell+0.5);
      if(cov < 0.85 && r2[i] > EDGE_SHOW) continue;
      ctx.fillStyle = RED;
      if(r1[i] < SQUARE_RATIO){
        ctx.fillRect(x+1.5, y+1.5, cell-3, cell-3);
      }else{
        ctx.fillText(LETTERS[(r3[i]*LETTERS.length)|0], x+cell/2, y+cell/2+1);
      }
    }
  }
}

function loop(){
  requestAnimationFrame(loop);
  if(!seg || !stream || video.readyState < 2) return;
  const mirror = facing === "user";
  const ts = performance.now();
  if(ts !== lastTs){
    lastTs = ts;
    seg.segmentForVideo(video, ts, res => {
      const ms = res.confidenceMasks;
      const m = ms[ms.length-1];
      const arr = m.getAsFloat32Array();
      mw = m.width; mh = m.height;
      if(!mask || mask.length !== arr.length) mask = new Float32Array(arr.length);
      mask.set(arr);
    });
  }
  if(seg2 && frameNo++ % OBJ_EVERY === 0){
    seg2.segmentForVideo(video, ts+0.5, res => {
      const m = res.categoryMask;
      const arr = m.getAsUint8Array();
      ow = m.width; oh = m.height;
      if(!omask || omask.length !== arr.length) omask = new Uint8Array(arr.length);
      for(let i=0;i<arr.length;i++) omask[i] = (arr[i]>0 && arr[i]!==PERSON_CLASS) ? 1 : 0;
    });
  }
  drawGray(mirror);
  drawCells(mirror);
}

$("flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  try{ await startCam(); }catch(e){ msg.textContent = "카메라 전환 실패"; }
};

$("shot").onclick = () => {
  canvas.toBlob(async blob => {
    const file = new File([blob], `silica-${Date.now()}.png`, {type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==="AbortError") return; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }, "image/png");
};

(async () => {
  try{
    await startCam();
    await initModel();
    msg.textContent = "";
    loop();
  }catch(e){
    msg.textContent = "카메라/모델 로드 실패: " + (e.message || e.name) + " (HTTPS 또는 localhost에서 열어야 해요)";
  }
})();
</script>
</body>
</html>
